
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

    <h1>Gestión de productos</h1>

    <h3>Lista de productos</h3>

    <p th:if="${mensaje}" th:text="${mensaje}"
       class="text-success"></p>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Proveedor</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="producto : ${productos}">

                <td th:text="${producto.id}"></td>
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.descripcion}"></td>
                <td th:text="${producto.precio}"></td>
                <td th:text="${producto.stock}"></td>
                <td th:text="${producto.proveedor.nombre}"></td>

                <td>
                    <a th:href="@{/productos/editar/{id}(id=${producto.id})}">
                        Editar
                    </a>

                    <form th:action="@{/productos/eliminar/{id}(id=${producto.id})}"
                          method="post"
                          style="display:inline"
                          onsubmit="return confirm('¿Quieres eliminar este producto?');">

                        <button type="submit"
                                class="btn btn-link p-0">
                            Borrar
                        </button>

                    </form>
                </td>

            </tr>
        </tbody>

    </table>

    <a th:href="@{/productos/nuevo}">Añadir nuevo</a>

    <br><br>

    <a th:href="@{/}">Volver al inicio</a>

    <footer class="mt-5">
        <p>2026 DAM</p>
    </footer>

</body>
</html>
