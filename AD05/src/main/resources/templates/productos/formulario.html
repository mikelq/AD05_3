
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

    <h1>Producto</h1>

    <form th:action="@{/productos/guardar}"
          th:object="${producto}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label>Nombre:</label>

            <input type="text" th:field="*{nombre}"
                   class="form-control">

            <span th:errors="*{nombre}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label>Descripción:</label>

            <input type="text" th:field="*{descripcion}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Precio:</label>

            <input type="number" step="0.01"
                   th:field="*{precio}"
                   class="form-control">

            <span th:errors="*{precio}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label>Stock:</label>

            <input type="number" th:field="*{stock}"
                   class="form-control">

            <span th:errors="*{stock}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label>Proveedor:</label>

            <select name="proveedorId" class="form-select" required>

                <option value="">Selecciona un proveedor</option>

                <option th:each="prov : ${proveedores}"
                        th:value="${prov.id}"
                        th:text="${prov.nombre}"
                        th:selected="${producto.proveedor != null and producto.proveedor.id == prov.id}">
                </option>

            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Guardar
        </button>

        <a th:href="@{/productos}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</body>
</html>
