
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de proveedor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

    <h1>Proveedor</h1>

    <form th:action="@{/proveedores/guardar}"
          th:object="${proveedor}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}"
                   class="form-control">

            <span th:errors="*{nombre}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label>Dirección:</label>
            <input type="text" th:field="*{direccion}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Teléfono:</label>
            <input type="text" th:field="*{telefono}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Email:</label>
            <input type="email" th:field="*{email}"
                   class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">
            Guardar
        </button>

        <a th:href="@{/proveedores}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</body>
</html>
