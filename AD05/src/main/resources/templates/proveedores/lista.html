
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de proveedores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

    <h1>Gestión de proveedores</h1>

    <h3>Lista de proveedores</h3>

    <p th:if="${mensaje}" th:text="${mensaje}"
       class="text-success"></p>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="proveedor : ${proveedores}">

                <td th:text="${proveedor.id}"></td>
                <td th:text="${proveedor.nombre}"></td>
                <td th:text="${proveedor.direccion}"></td>
                <td th:text="${proveedor.telefono}"></td>
                <td th:text="${proveedor.email}"></td>

                <td>
                    <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}">
                        Editar
                    </a>

                    <form th:action="@{/proveedores/eliminar/{id}(id=${proveedor.id})}"
                          method="post"
                          style="display:inline"
                          onsubmit="return confirm('¿Eliminar este proveedor y todos sus productos?');">

                        <button type="submit"
                                class="btn btn-link p-0">
                            Borrar
                        </button>

                    </form>
                </td>

            </tr>
        </tbody>

    </table>

    <a th:href="@{/proveedores/nuevo}">Añadir nuevo</a>

    <br><br>

    <a th:href="@{/}">Volver al inicio</a>

    <footer class="mt-5">
        <p>2026 DAM</p>
    </footer>

</body>
</html>
